# Binance USDⓈ-M Futures scanner. No order-routing capability exists.
data_provider: binance_futures
runtime:
  stale_after_seconds: 10
  reconnect_backoff_seconds: 3
  signal_cooldown_minutes: 20
dashboard:
  host: 0.0.0.0
  port: 8347
telegram:
  enabled: false
binance_futures:
  # Official USDⓈ-M endpoints documented by Binance.
  rest_url: https://fapi.binance.com
  websocket_url: wss://fstream.binance.com
  universe_size: 50
  historical_limit: 100
universe:
  # Populated at runtime from official 24-hour quote-volume tickers.
  symbols: []
  benchmark_symbol: BTCUSDT
scoring:
  bearish_regime_penalty: 12
  buckets:
    strong_sell_max: 29
    sell_max: 44
    wait_max: 59
    buy_max: 74
backtest:
  commission_bps: 10
  slippage_bps: 5
