# Values here are safe defaults for local development. Keep credentials in .env.
data_provider: mock
runtime:
  stale_after_seconds: 45
  startup_warmup_seconds: 8
  reconnect_backoff_seconds: 3
  signal_cooldown_minutes: 20
dashboard:
  host: 0.0.0.0
  port: 8347
telegram:
  enabled: false
dxfeed:
  # Set DXFEED_WS_URL from your dxFeed welcome letter. Do not use the demo
  # endpoint for BIST signals: demo access can be delayed or lack BIST rights.
  websocket_url_env: DXFEED_WS_URL
  token_env: DXFEED_TOKEN
  index_symbol: XU100:TR
itick:
  # Official stock endpoint. iTick documents authentication through the token
  # WebSocket header and Turkish stock codes as SYMBOL$TR.
  websocket_url_env: ITICK_WS_URL
  websocket_url: wss://api-free.itick.org/stock
  api_key_env: ITICK_API_KEY
  region: TR
  # Start with three liquid names. If iTick rejects this pool, the provider
  # safely retries the documented two-symbol subset.
  symbols:
    - THYAO
    - EREGL
    - KCHOL
scoring:
  bullish_regime_penalty: 0
  bearish_regime_penalty: 12
  buckets:
    strong_sell_max: 29
    sell_max: 44
    wait_max: 59
    buy_max: 74
backtest:
  commission_bps: 10
  slippage_bps: 5
