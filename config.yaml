# Binance USDⓈ-M Futures scanner. No order-routing capability exists.
data_provider: binance_futures
runtime:
  stale_after_seconds: 10
  reconnect_backoff_seconds: 3
  signal_cooldown_minutes: 20
dashboard:
  host: 0.0.0.0
  port: 8347
telegram:
  enabled: false
binance_futures:
  # Official USDⓈ-M Kline REST and combined WebSocket endpoints.
  rest_url: https://fapi.binance.com
  websocket_url: wss://fstream.binance.com
  historical_limit: 100
universe:
  # The provider owns the static 50-contract fallback universe.
  symbols: []
  benchmark_symbol: BTCUSDT
scoring:
  bearish_regime_penalty: 6
  buckets:
    strong_sell_max: 32
    sell_max: 47
    wait_max: 52
    buy_max: 67
backtest:
  commission_bps: 10
  slippage_bps: 5
